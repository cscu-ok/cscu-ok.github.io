name: Build check

on:
  pull_request:
    branches: [v2, main]

# FR-1: this workflow builds and checks a PR. It must never deploy anything —
# see .github/workflows/deploy.yml (added in M5) for the workflow that publishes.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Check old site URLs still resolve (FR-9)
        run: npm run test:redirects

      # FR-24's placeholder guard ("TODO(content) must fail a production build") is
      # NOT run here on purpose: during normal development, stub pages legitimately
      # carry TODO(content) until their milestone fills them in, and gating every PR
      # on it would make the check permanently red. It runs instead in the deploy
      # workflow (M5) and as cutover checklist item 4 (docs-site/DEPLOY.md), which is
      # the actual "production build" this requirement means.

      - name: Check internal links (FR-27)
        run: npm run test:links

      - name: Check accessibility (FR-23)
        run: npm run test:a11y

      - name: Check performance budget (FR-25)
        run: npx @lhci/cli autorun --config=./.lighthouserc.json

      - name: Check no third-party trackers (FR-26, C8)
        run: |
          if grep -rIlE 'googletagmanager|google-analytics|gtag\(|facebook\.net/[a-z]+/fbevents|hotjar|segment\.(io|com)|mixpanel' dist 2>/dev/null | grep -q .; then
            echo "Third-party tracker reference found in built output:"
            grep -rIlnE 'googletagmanager|google-analytics|gtag\(|facebook\.net/[a-z]+/fbevents|hotjar|segment\.(io|com)|mixpanel' dist
            exit 1
          fi
