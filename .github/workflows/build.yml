name: Build check

on:
  pull_request:
    branches: [v2, main]

# FR-1: this workflow builds and checks a PR. It must never deploy anything —
# see .github/workflows/deploy.yml (added in M5) for the workflow that publishes.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Check for shipped placeholder content (FR-24)
        run: |
          if grep -rIl --exclude-dir=node_modules -e 'TODO(content)' -e 'lorem ipsum' src/content dist 2>/dev/null | grep -q .; then
            echo "Placeholder content found in src/content or the built output:"
            grep -rIln --exclude-dir=node_modules -e 'TODO(content)' -e 'lorem ipsum' src/content dist 2>/dev/null
            exit 1
          fi

      - name: Check internal links (FR-27)
        run: npm run test:links

      - name: Check accessibility (FR-23)
        run: npm run test:a11y

      - name: Check no third-party trackers (FR-26, C8)
        run: |
          if grep -rIlE 'googletagmanager|google-analytics|gtag\(|facebook\.net/[a-z]+/fbevents|hotjar|segment\.(io|com)|mixpanel' dist 2>/dev/null | grep -q .; then
            echo "Third-party tracker reference found in built output:"
            grep -rIlnE 'googletagmanager|google-analytics|gtag\(|facebook\.net/[a-z]+/fbevents|hotjar|segment\.(io|com)|mixpanel' dist
            exit 1
          fi

      - name: Verify CNAME survives the build (FR-4)
        run: |
          test "$(cat dist/CNAME)" = "cscusuo.org" || (echo "dist/CNAME missing or incorrect" && exit 1)
